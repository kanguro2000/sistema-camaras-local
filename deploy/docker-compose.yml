services:
  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: gateway
    expose:
      - "8080"
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - ../data:/workspace/apps/gateway/data
    env_file:
      - ../.env
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: web
    depends_on:
      - gateway
    ports:
      - "8080:8080"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
