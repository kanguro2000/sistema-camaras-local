name: CI

on:
  push:
    branches: [master, staging, develop]
  pull_request:
    branches: [master, staging, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  branch-flow:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verificar origen del PR (feature → develop → staging → master)
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          case "$BASE" in
            staging) ALLOWED="develop" ;;
            master) ALLOWED="staging" ;;
            *) exit 0 ;;
          esac
          if [[ "$HEAD" == "$ALLOWED" || "$HEAD" == hotfix/* ]]; then
            echo "PR $HEAD → $BASE permitido."
          else
            echo "::error::Los PR hacia '$BASE' deben venir de '$ALLOWED' (o de una rama hotfix/*). Origen recibido: '$HEAD'."
            exit 1
          fi

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Subir reportes de Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  deploy-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Analizar scripts de despliegue con ShellCheck
        run: shellcheck --severity=warning deploy/*.sh
      - name: Validar docker-compose.yml
        run: |
          touch .env
          docker compose -f deploy/docker-compose.yml config --quiet
      - name: Construir imagen del gateway
        run: docker build -f deploy/Dockerfile --target gateway -t sistema-camaras-gateway:ci .
      - name: Construir imagen web
        run: docker build -f deploy/Dockerfile --target web -t sistema-camaras-web:ci .

  publish-images:
    if: github.event_name == 'push'
    needs: [validate, deploy-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Calcular etiqueta del ambiente
        run: |
          if [ "$GITHUB_REF_NAME" = "master" ]; then TAG="latest"; else TAG="$GITHUB_REF_NAME"; fi
          echo "ENV_TAG=$TAG" >> "$GITHUB_ENV"
          echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publicar imagen del gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: gateway
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/sistema-camaras-gateway:${{ env.ENV_TAG }}
            ghcr.io/${{ env.IMAGE_OWNER }}/sistema-camaras-gateway:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,scope=gateway,mode=max
      - name: Publicar imagen web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: web
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/sistema-camaras-web:${{ env.ENV_TAG }}
            ghcr.io/${{ env.IMAGE_OWNER }}/sistema-camaras-web:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  promote:
    if: github.event_name == 'push' && (github.ref_name == 'develop' || github.ref_name == 'staging')
    needs: [validate, deploy-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Abrir PR de promoción
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SOURCE: ${{ github.ref_name }}
        run: |
          if [ "$SOURCE" = "develop" ]; then TARGET="staging"; else TARGET="master"; fi
          AHEAD="$(gh api "repos/$GH_REPO/compare/$TARGET...$SOURCE" --jq .ahead_by)"
          if [ "$AHEAD" -eq 0 ]; then
            echo "$SOURCE no tiene cambios pendientes para $TARGET."
            exit 0
          fi
          OPEN="$(gh pr list --head "$SOURCE" --base "$TARGET" --state open --json number --jq length)"
          if [ "$OPEN" -gt 0 ]; then
            echo "Ya existe un PR abierto de $SOURCE a $TARGET."
            exit 0
          fi
          BODY="Promoción automática de \`$SOURCE\` a \`$TARGET\` tras pasar CI en el commit \`${GITHUB_SHA::7}\`. Revisa los cambios y fusiona con merge commit."
          gh pr create --head "$SOURCE" --base "$TARGET" \
            --title "chore: promover $SOURCE a $TARGET" --body "$BODY" \
            || echo "::warning::No se pudo crear el PR. Activa Settings → Actions → General → 'Allow GitHub Actions to create and approve pull requests'."
