name: CI

on:
  push:
    branches: [master, staging, develop]
  pull_request:
    branches: [master, staging, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  branch-flow:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verificar origen del PR (feature → develop → staging → master)
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          case "$BASE" in
            staging) ALLOWED="develop" ;;
            master) ALLOWED="staging" ;;
            *) exit 0 ;;
          esac
          if [[ "$HEAD" == "$ALLOWED" || "$HEAD" == hotfix/* ]]; then
            echo "PR $HEAD → $BASE permitido."
          else
            echo "::error::Los PR hacia '$BASE' deben venir de '$ALLOWED' (o de una rama hotfix/*). Origen recibido: '$HEAD'."
            exit 1
          fi

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.14.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm -r test
      - run: pnpm build
      - name: Auditar dependencias de producción
        run: pnpm audit --prod --audit-level=high
      - name: Medir cobertura de pruebas unitarias
        run: |
          {
            echo "## Cobertura de pruebas unitarias"
            echo '```'
            pnpm test:coverage 2>&1 | grep -E "test:coverage: ℹ (all files|file )|^(packages|apps)/.*all files" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Corre en paralelo con validate: la descarga de Chromium es lo más lento del pipeline.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.14.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Versión de Playwright
        id: pw
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Caché de navegadores de Playwright
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Instalar Chromium y dependencias del sistema
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Instalar solo dependencias del sistema (navegador en caché)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - run: pnpm --filter @sistema-camaras/shared build
      - run: pnpm test:e2e
      - name: Subir reportes de Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  rtsp-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.14.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Instalar FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Iniciar servidor RTSP simulado (MediaMTX)
        run: |
          docker run -d --name mediamtx --network host bluenviron/mediamtx:1.21.3
          for _ in $(seq 1 20); do
            (echo > /dev/tcp/127.0.0.1/8554) 2>/dev/null && exit 0
            sleep 1
          done
          docker logs mediamtx
          echo "::error::MediaMTX no abrió el puerto 8554."
          exit 1
      - name: Probar el gateway con una cámara RTSP simulada
        env:
          RTSP_INTEGRATION: "1"
        run: pnpm test:rtsp
      - name: Mostrar logs de MediaMTX si falla
        if: failure()
        run: docker logs mediamtx

  deploy-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Analizar scripts de despliegue con ShellCheck
        run: shellcheck --severity=warning deploy/*.sh
      - name: Validar docker-compose.yml
        run: |
          touch .env
          docker compose -f deploy/docker-compose.yml config --quiet
      - uses: docker/setup-buildx-action@v3
      - name: Construir imagen del gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: gateway
          load: true
          tags: sistema-camaras-gateway:ci
          cache-from: type=gha,scope=gateway
      - name: Construir imagen web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: web
          load: true
          tags: sistema-camaras-web:ci
          cache-from: type=gha,scope=web
      - name: Escanear vulnerabilidades en la imagen del gateway
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sistema-camaras-gateway:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Escanear vulnerabilidades en la imagen web
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sistema-camaras-web:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  publish-images:
    if: github.event_name == 'push'
    needs: [validate, e2e, deploy-checks, rtsp-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Calcular etiqueta del ambiente
        run: |
          if [ "$GITHUB_REF_NAME" = "master" ]; then TAG="latest"; else TAG="$GITHUB_REF_NAME"; fi
          echo "ENV_TAG=$TAG" >> "$GITHUB_ENV"
          echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publicar imagen del gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: gateway
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/sistema-camaras-gateway:${{ env.ENV_TAG }}
            ghcr.io/${{ env.IMAGE_OWNER }}/sistema-camaras-gateway:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,scope=gateway,mode=max
      - name: Publicar imagen web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: web
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/sistema-camaras-web:${{ env.ENV_TAG }}
            ghcr.io/${{ env.IMAGE_OWNER }}/sistema-camaras-web:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  promote:
    if: github.event_name == 'push' && (github.ref_name == 'develop' || github.ref_name == 'staging')
    needs: [validate, e2e, deploy-checks, rtsp-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Abrir PR de promoción
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SOURCE: ${{ github.ref_name }}
        run: |
          if [ "$SOURCE" = "develop" ]; then TARGET="staging"; else TARGET="master"; fi
          AHEAD="$(gh api "repos/$GH_REPO/compare/$TARGET...$SOURCE" --jq .ahead_by)"
          if [ "$AHEAD" -eq 0 ]; then
            echo "$SOURCE no tiene cambios pendientes para $TARGET."
            exit 0
          fi
          OPEN="$(gh pr list --head "$SOURCE" --base "$TARGET" --state open --json number --jq length)"
          if [ "$OPEN" -gt 0 ]; then
            echo "Ya existe un PR abierto de $SOURCE a $TARGET."
            exit 0
          fi
          BODY="Promoción automática de \`$SOURCE\` a \`$TARGET\` tras pasar CI en el commit \`${GITHUB_SHA::7}\`. Revisa los cambios y fusiona con merge commit."
          gh pr create --head "$SOURCE" --base "$TARGET" \
            --title "chore: promover $SOURCE a $TARGET" --body "$BODY" \
            || echo "::warning::No se pudo crear el PR. Activa Settings → Actions → General → 'Allow GitHub Actions to create and approve pull requests'."
