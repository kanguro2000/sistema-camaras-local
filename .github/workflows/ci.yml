name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Subir reportes de Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  deploy-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Analizar scripts de despliegue con ShellCheck
        run: shellcheck --severity=warning deploy/*.sh
      - name: Validar docker-compose.yml
        run: |
          touch .env
          docker compose -f deploy/docker-compose.yml config --quiet
      - name: Construir imagen del gateway
        run: docker build -f deploy/Dockerfile --target gateway -t sistema-camaras-gateway:ci .
      - name: Construir imagen web
        run: docker build -f deploy/Dockerfile --target web -t sistema-camaras-web:ci .
