name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verificar que la etiqueta pertenece a master
        run: |
          git fetch origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::La etiqueta $GITHUB_REF_NAME debe apuntar a un commit de master."
            exit 1
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Etiquetar las imágenes ya probadas con la versión
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          for NAME in gateway web; do
            SRC="ghcr.io/$OWNER/sistema-camaras-$NAME:sha-$GITHUB_SHA"
            if ! docker buildx imagetools inspect "$SRC" > /dev/null 2>&1; then
              echo "::error::No existe $SRC. Espera a que el CI de master termine de publicar las imágenes."
              exit 1
            fi
            docker buildx imagetools create -t "ghcr.io/$OWNER/sistema-camaras-$NAME:$GITHUB_REF_NAME" "$SRC"
          done
      - name: Crear la Release con notas automáticas
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
